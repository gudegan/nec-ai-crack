function getValue(url,key){
    url = url.toString();
	if(url.indexOf('#')>=0){
		url = url.substring(0,url.length-1);
	}
	var value='';
	var begin = url.indexOf(key + '=');
	if(begin>=0){
		var tmp = url.substring(begin + key.length + 1);
		var eqIdx = tmp.indexOf('=');
		var end = 0;
		if(eqIdx>=0){
			tmp = tmp.substring(0,eqIdx);
			end = tmp.lastIndexOf('&');
		}else{
			end = tmp.length;
		}
		if(end>=0){
			try{
				value = decodeURIComponent(tmp.substring(0,end));
			}catch(e){
				value = tmp.substring(0,end);
			}
		}else{
			try{
				value = decodeURIComponent(tmp);
			}catch(e){
				value = tmp;
			}
		}
	}
	return value;
}

function initSavePosition(){
    var savepos = callClient("DGetSavePosition");
    var saveposobj = eval('('+savepos+')');
    saveposobj = saveposobj.position;
    var posarray = [];
    var possize = saveposobj.length;
    var clearPath = saveposobj[possize-2];
    if(possize>2){
        if(possize>4){
            saveposobj = saveposobj.slice(0,3);
            saveposobj.push(clearPath);
            possize = saveposobj.length;
        }else{
            possize = possize-1;
        }
        for(var m=0;m<possize;m++){
            var posobj = saveposobj[m];
            var pos = "";
            try{
                pos = decodeURIComponent(posobj.pos);
            }catch(e){
                pos = posobj.pos;
            }
            if(m==0){
                $(".d_pos_center input").val(pos);
            }
            posarray[posarray.length++] = '<a href="###" hidefocus>';
            posarray[posarray.length++] = pos;
            posarray[posarray.length++] = '</a>';
        }
    }else{
        for(var n=possize-1;n>=0;n--){
            var posobj = saveposobj[n];
            var pos = "";
            try{
                pos = decodeURIComponent(posobj.pos||posobj.defaultpos);
            }catch(e){
                pos = posobj.pos||posobj.defaultpos;
            }
            if(n==possize-1){
                $(".d_pos_center input").val(pos);
            }
            posarray[posarray.length++] = '<a href="###" hidefocus>';
            posarray[posarray.length++] = pos;
            posarray[posarray.length++] = '</a>';
        }
    }
    $(".d_pos_history").html(posarray.join(""));
}

                if (hq=="超品音质" || hq=="高品音质"||hq=="无损音质"){

                    if (fmt == someobj.fmt && videoType2==0) {
                        videoType1++;
                        audioarray.push(someobj);
                        continue;

                    if (fmt_bak == someobj.fmt && videoType1==0) {
                        videoType2++;
                        audioarray.push(someobj);
                        continue;
                    }

                } else {
                    if (someobj.fmt==fmt ) {
                        audioarray.push(someobj);
                    }
                }
            }

                var _st = audioarray[0].st+''+audioarray[1].st;

                var starray = [];
                starray.push(audioarray[0]);
                starray.push(audioarray[1]);
                someobj.starray = starray;
                someobj.id = payObj.id;

                downbr = someobj.br;
            } else {
                //错误数据 length==3
                var someobj = audioarray[0];
                downbr = someobj.br;
            }
            getPCAdInfo(someobj);
        }

        outLineSongHandle();
    }

function howToShowMvTips() {
  // console.log('howToShowMvTips')
  var isSupVip = callClient('UsrMusicFeePayment') === '3';
  var defaultTips = {
    noVipIntercept: "下载MV是豪华VIP专项特权，开通VIP后即可畅享",

  }
  if (isSupVip) {
    // 是豪华vip
    // todo
    // console.log('getMvInfoPromise: ', getMvInfoPromise);
    if (!getMvInfoPromise && timerCount < 49) {
      setTimeout(() => {
        howToShowMvTips();
      }, 150)
      return;
    }
    getMvInfoPromise.then(res => {
      // 流畅（176.4K） ---》FD
      // 标清（10.3M）---》SD
      // 高清---》HD
      // 超清---》FHD
      // 蓝光---》BD
      var data = res.data[0];
      var payinfo_download = 0; // 资源本身 0免费 1付费
      var right_donwload = 0; // <= 100 可以下
      if (data) { // 依次去视频清晰度
        if (data.BD) {
          payinfo_download = data.BD.payinfo.download;
          right_donwload = data.BD.right.download;
        } else if (data.FHD) {
          payinfo_download = data.FHD.payinfo.download;
          right_donwload = data.FHD.right.download;
        } else if (data.HD) {
          payinfo_download = data.HD.payinfo.download;
          right_donwload = data.HD.right.download;
        } else if (data.SD) {
          payinfo_download = data.SD.payinfo.download;
          right_donwload = data.SD.right.download;
        } else if (data.FD) {
          payinfo_download = data.FD.payinfo.download;
          right_donwload = data.FD.right.download;
        }
      }
      if (payinfo_download == 0) {
        // 本身免费的
        $(".d_monthly_login").html(`<span>该MV您可畅享下载</span>`);
      } else {
        // right_donwload > 100 没权限 得要开通 小于100免费
        if (right_donwload <= 100) {
          // 付费mv资源，可以下载
          $(".d_monthly_login").html(`<span>${mvTipsData.vipTipsNoTOP}</span>`);
          $(".d_pay_down").html("下载").attr('data-mv', '0'); // data-mv 作为按钮判断类型
        } else {
          var mvJson = res.data[0] && res.data[0].mvJson || '{"svip":{"valid":1,"update":0,"full":0}}';
          if (mvJson) {
            mvJson = JSON.parse(mvJson);
            // console.log('mvJson: ', mvJson);
            // full为0一直可以下  update为1可以升级配额
            try {
              var full = mvJson.svip&&mvJson.svip.full || mvJson.vip&&mvJson.vip.full || 0;
              var update = mvJson.svip&&mvJson.svip.full || mvJson.vip&&mvJson.vip.update || 0;
            } catch (e) {
              var full = 0;
              var update = 0;
            }
            
            if (update == 0 && full == 0) {
              // 没权限 需开通
              openSuperVipFn();
            } else if (update == 1 && full == 1) {
              // 可升级， 已满
              // 不可以下，但是能升级配额
              $(".d_monthly_login").html(`<span>${mvTipsData.vipTips}</span>`);
              $(".d_pay_down").html("升级配额").attr('data-mv', '1'); // data-mv: 1 升级配额
            } else if (update == 0 && full == 1) {
              // 已升级， 且满
              // 本月会员额度用完且升级也用完了
              $(".d_monthly_login").html(`<span>${mvTipsData.boxText}</span>`);
              $(".d_pay_down").html("我知道了").attr('data-mv', '2').css('cursor', 'default'); // data-mv: 2 我知道了
            } else {
              // 都失败的情况 走付费豪华vip
              // 包括 updata = 1 full = 0 下载码率超过限定码率了  也是没权限
              openSuperVipFn();
            }
            // if (full == 0) {
            //   // 可以下
            //   $(".d_monthly_login").html(`<span>${mvTipsData.vipTipsNoTOP}</span>`);
            //   $(".d_pay_down").html("下载").attr('data-mv', '0');
            // } else if (update == 1) {
            //   // 不可以下，但是能升级配额
            //   $(".d_monthly_login").html(`<span>${mvTipsData.vipTips}</span>`);
            //   $(".d_pay_down").html("升级配额").attr('data-mv', '1'); // data-mv: 1 升级配额
            // } else {
            //   // 本月会员额度用完且升级也用完了
            //   $(".d_monthly_login").html(`<span>${mvTipsData.boxText}</span>`);
            //   $(".d_pay_down").html("我知道了").attr('data-mv', '2').css('cursor', 'default'); // data-mv: 2 我知道了
            // }
          } else {
            openSuperVipFn();
          }
        }
      }
    }).catch(e => {
      openSuperVipFn();
    });
  } else {
    // 不是豪华vip
    openSuperVipFn();
  }
}

// 动态设置提示
function setDownTips(textList,tips) {
    var len = textList.length;
    if(len==0)return;
    var text = "";
    if(len){
        for(var i=0;i<len;i++){
            text += '<span>'+decodeURIComponent(textList[i].text).replace("+"," ")+'</span>';
        }
    }else{
        if(textList.text1){
            text += '<span>'+textList.text1.replace("X",vipcount).replace("X",_downlast)+'</span>';
        }
        if(textList.text2){
            text += '<span>'+textList.text2.replace("X",vipcount).replace("X",_downlast)+'</span>';
        }
        if (textList.text) {
            text += textList.text;
        }
    }
    if(tips){
        text+=tips;
        $(".d_monthly_login").css("line-height","22px");
    }
    // 判断是否付费，并且不展示MP3下载券
    if (!fpay && payObj && payObj.mp3Download === undefined) {
        // 将 text 中 MP3下载可导出永久播放， 剔除
        text = text.replace(/MP3下载可导出永久播放，普通下载仅会员有效期内本地播放/g, '版权方要求，会员用户可下载会员歌曲');
    }
    $(".d_monthly_login").html(text).find("a").click(function(){
        var link = $(this).attr("href");
        window.open(link);
        return false;
    });
    /*
    * 音乐包及vip下载额度用尽后流程优化（提示文案修改）
    * @author 邢祥超 [20190719]
    * */
    if (quotasExhaust) {

/**
 * @description: 获取用户信息,超会MP3下载券需求，获取当前会员等级; 
 * @time: 20250923
 * **/
function getUserInfo() {
    // 根据虚拟用户id获取会员信息 备用
    // `${vipBaseUrl}/vip/v2/user/vip?op=getVipSamInfoForVirtualUser&virtualUserId=${virtualUid}`
    if (loginUid === '0') return;
    $.ajax({
        url: `${vipBaseUrl}/vip/v2/user/vip?op=ui&uid=${loginUid}&extend=1`,
        type: 'get',
        success: function(res) {
            var resJSON = JSON.parse(res || '{}');
            if (resJSON && resJSON.data) {
                userVipInfo = resJSON.data || {};
                // 会员等级映射关系
                var userVipLevelMap = {
                    'VIP0': 0,
                    'VIP1': 1,
                    'VIP2': 2,
                    'VIP3': 3,
                    'VIP4': 4,
                    'VIP5': 5,
                    'VIP6': 6,
                    'VIP7': 7,
                };
                var vipLevel = userVipLevelMap[userVipInfo.vipTag || 'VIP0'] || 0;
                userVipInfo.level = vipLevel; // 会员等级
                userVipInfo.isDownloadMp3 = vipLevel >= 2; // 是否可以下载MP3，svip2及以上会员可以下载MP3
            }
        }
    })
}

/*
* 超会MP3下载券需求
* musicPay 接口 - payObj.mp3Download 字段
* mp3Download.couponNum：剩余mp3下载券数量
* mp3Download.isSVip：是否为超会
* mp3Download.isShow：是否展示mp3下载入口,1展示，0不展示
* @author 邢祥超 [20250923]
* */
function getMusicPayMp3Download(isShowBtn) {
	if (payObj && payObj.mp3Download && payObj.mp3Download.isShow === 1) {
		var couponNum = payObj.mp3Download.couponNum || 0;
		var isSVip = payObj.mp3Download.isSVip === 1;
		if (isSVip && userVipInfo.isDownloadMp3) {
			// 超会用户
			if (couponNum > 0) {
				// 有下载券
				isShowBtn && $(".d_pay_down_mp3").html(`MP3下载（本月剩余${couponNum}张）`).show();
			} else {
				// 无下载券
				isShowBtn && $(".d_pay_down_mp3").html('MP3下载（本月已用完）').show().addClass('disabled');
			}
            realTimeLog("MUSIC_FEE","FEE_TYPE:MP3_DOWNLOAD_BTN_SHOW|VIEW_TYPE:SINGLE_DOWNLOAD|"+psrcPath + "|REL_ID:" + musicRid);
			hideSvipMp3Banner();
		} else {
			// 非超会用户 || 超会等级低于SVIP2
			isShowBtn && $(".d_pay_down_mp3").html('升级超级会员SVIP2（送MP3下载券）').show();
            realTimeLog("MUSIC_FEE","FEE_TYPE:MP3_DOWNLOAD_OPENSVIP_BTN_SHOW|VIEW_TYPE:SINGLE_DOWNLOAD|"+psrcPath + "|REL_ID:" + musicRid);
			!isSVip && showSvipMp3Banner();
		}
	} else {
		// 不展示
		$(".d_pay_down_mp3").hide();
		$(".svip-mp3download").hide();
	}
}
