<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>歌手cd列表</title>
	<link href="css/iconfont.css" rel="stylesheet" type="text/css" />
	<link href="css/reset.css" rel="stylesheet" type="text/css" />
    <link href="css/to_top.css" rel="stylesheet" />
	<link href="css/channel_cdpack.css" rel="stylesheet" type="text/css" />
	<script src="js/jquery.js" type="text/javascript"></script>
	<script src="js/comm2.js" type="text/javascript"></script>
	<script src="js/cdpackArtistCdList.js" type="text/javascript"></script>
</head>
<body>
	<div class="indexContentBox">
		<div class="navBox">
			<div class="logo">
				<div class="logo_icon"><i></i></div>
				<div class="logo_icon_splice"></div>
			</div>
			<h1>发烧音乐</h1>
			<div class="nav">
				<a href="javascript:commonClick({'source':'9002'});" class="index active"><span>发现音乐<i></i></span></a>
				<a href="javascript:;" class="jumpLike"><span>我的收藏</span><label></label></a>
				<a href="javascript:;" class="jumpDown"><span>我的下载</span><label></label></a>
			</div>
		</div>
		<div class="artistCdListTop">
			<div class="artistInfoBox">
				<img class="cover" src="img/default.png" onerror="this.src='img/default.png'" />
				<div class="artistInfo">
					<div class="info">
						<h1></h1>
					</div>
					<span class="cdCnt"></span>
					<div class="artistIntroBox">
						<span class="lookIntro"><i class="icon"><i></i></i>查看简介</span>
						<div class="cdIntro">
							<p></p>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="nodataBox">
			<img src="img/cdpack/nodata.png">
			<p>暂无相关内容噢，</p>
			<p>酷小我正在努力获取资源中...</p>
		</div>
		<ul class="cdListBox artistCdList" data-model="kw_cdlistModel"></ul>
		<div id="page" class="page"></div>
	</div>
	<span id="target"></span>
	<a href="###" hidefocus class="rtop backTop" onclick="returnTop(); return false;"></a>
	<!-- model -->
	<ul id="kw_cdInexLabelModel" style="display:none;">
		<li onclick="{$click}">
			<img src="{$pic}" />
			<div class="splice"></div>
			<span style="{$color}" >{$name}</span>
		</li>
	</ul>

	<ul id="kw_cdlistModel" style="display:none;">
		<li class="cdList cd_{$id}">
			<a href="javascript:;" hidefocus class="cdimg" onclick="{$click}">
				<div class="coverBox">
					<div class="cover">
						<img class="toppic lazy" src="img/cdpack/second/default.png" data-original="{$pic}" onerror="imgOnError(this,'150cd');">
					</div>
					<span class="cdshadow"></span>
					<div class="splice"></div>
					<div class="cdTagBox">
						<div class="downTimes"><span></span>{$downTimes}</div>
						{$isMd}
					</div>
					<div class="downBtnBox">
						<i onclick="{$iclick}return false;" class="i_down j_i_down" data-id="{$id}">
							<i class="i_Arrow"></i>
						</i>
					</div>
				</div>
			</a>
			<div class="cdInfo">
				<div class="cdInfoCon">
					<div class="name">
						<a href="javascript:;" class="cdName" title="{$cdname}" onclick="{$click}">{$cdname}</a>
					</div>
					<div class="artist">
						<span class="artistName" title="{$artistname}">{$artistname}</span>
					</div>
					<p class="cdIntr allowSelect">{$cdInfo}</p>
					<div class="cdInfo_botoom">
						<p class="type">{$type}</p>
						<span class="size {$notype}">{$size}</span>
					</div>
				</div>
			</div>
		</li>
	</ul>
	<ul id="kw_focusPicModel" style="display:none;">
		<li class="bannerlist">
			<a href="javascript:;">
				<img class="lazy" width="740" height="190" src="img/def750.png" data-original="{$pic}"  onerror="imgOnError(this,750)">
			</a>
		</li>
	</ul>
	<ul id="kw_tagModel" style="display:none;">
		<li class="{$typeName}" data-tagId="{$id}">{$name}</li>
	</ul>
	<div id="kw_searchListModel" style="display:none">
		<div class="item">
			<label>{$label}：</label>
			<ul class="tagList" data-model="kw_tagModel"></ul>
		</div>
	</div>
</body>
</html>
