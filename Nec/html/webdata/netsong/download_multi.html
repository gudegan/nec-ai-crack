    <script>
        /*
        * 908 付费低价策略需求
        * 用户信息 loginUid/virtualUid
        * 缓存 cacheId
        * 是否低级策略 isLowPrice
        * */
        var loginUid = getUserID('uid');
        var virtualUid = getVirtualUid('viruid');
        var cacheId = '';
        var isLowPrice = 0;
        var newCatchKey = 'PCAdInfoObjDownNew251013';
        if (loginUid !== '0') {
            cacheId = loginUid;
        } else if (virtualUid !== '0') {
            cacheId = virtualUid;
        }
        // 换肤
        function readFile(path) {
            return callClient(`ReadFile?path=${path}`);
        }
        function getSkinConfig() {
            var config = callClient('GetSkinConf');
            return config;
        }
        var fileName = 'netsong/skinConfig.json';
        var skinConfig = {
            "type": "default",
            "skinColor": "#FFD200",
            "linkColor": "#487BB6",
            "hifiColor": "#DFAB45",
            "opqSwitch": false
        };
        var skinConfigStr = getSkinConfig();
        function setSkin(data) {
            $(".isShowBtn").eq(1).addClass('specialBtn');
            if(data!=''){
                var jsonData = JSON.parse(data);
                var file = readFile(jsonData.dir + fileName);
                if (file!='') {
                    skinConfig = JSON.parse(file);
                }
            }
            var color = '#000000';
            if(skinConfig.type!='default'){
                color = skinConfig.skinColor;
            }
            if(isOld){
                $(".d_vip_open").css("background","#FAD785");
            }
            $(".checkBox").css('border-color','').find('label').css('border-color','');
            $(".checkBox input:checked+label").css('border-color',color).parent().css('border-color',color);
            $(".free_music p,.free_div_price").css('color', skinConfig.linkColor);
            $(".d_pay_down,.d_pay_down_month,.d_only_free,.know").css({'background':skinConfig.skinColor});
            $("body").addClass(skinConfig.type);
        }
        // 换肤结束
        // 判断发送日志次数，默认勾选及点击第一次
        var isWriteLog = 0;
        var psrcPath = '';
        if(getDataByCache("chargePsrc")){
            psrcPath = getDataByCache("chargePsrc");
            saveDataToCache("chargePsrc","nocache")
        }
        function saveDataToCache(url,dataValue,time){
            try{
                var cachetime;
                if(typeof(dataValue)!="undefined"&&dataValue!=""&&dataValue!=null){
                    if(url=="refreshnum"){
                        cachetime = 1200;
                    }else if(url=="INDEXDATA"){
                        cachetime = 10800;
                    }else{
                        if(url.indexOf("newsearch")<0){
                            cachetime = 1200;
                        }else{
                            cachetime = 86400;
                        }
                    }
                    if(typeof(time)!="undefined"){
                        cachetime = time;
                    }
                    callClientNoReturn("SetCache?key="+encodeURIComponent(url)+"&time="+cachetime+"\r\n"+dataValue);
                }
            }catch(e){
                webLog("saveDataToCache:"+e.message);
            }
        }
        function realTimeLog(type,msg){
            callClientNoReturn("LogRealTime?type="+type+"&msg="+encodeURIComponent(msg));
        }
        function getDataByCache(key){
            var cacheValue = callClient("GetCache?key="+encodeURIComponent(key));
            var data = "";
            if(typeof(cacheValue)!="undefined" && cacheValue!=""){
                try{
                    data = cacheValue;
                }catch(e){
                    webLog("getDataByCache:"+e.message+":"+e.name);
                }
            }
            return data;
        }
        //日志处理
        function logShow() {
            if (isWriteLog > 1) {
                return;
            }
            var isLogin = false;
            var isUpgrade = false;
            var isMonthPay = false;
            var isAlbumPay = false;
            var isSinglePay = false;
            var isVipOpen = false;
            var isExportPay = false;
            if (loginUid !== '0') {
                isLogin = true;
            }
            if ( ($(".d_pay_down_month").html().indexOf("下载") > -1 ) && ( $(".d_pay_down_month").css("display")!= "none" ) ) {
                isMonthPay = true;
            }
            if ( ($(".d_pay_down").html().indexOf("专辑") > -1 ) && ( $(".d_pay_down").css("display")!= "none" ) ) {
                isAlbumPay = true;
            }
            if ( ( $(".d_pay_down").html().indexOf("单曲") > -1||$(".d_pay_down").html().indexOf("按首") > -1 ) && ( $(".d_pay_down").css("display")!= "none" ) ) {
                isSinglePay = true;
            }
            if ( ( $(".d_pay_down").html().indexOf("导出") > -1 ) && ( $(".d_pay_down").css("display")!= "none" ) ) {
                isExportPay = true;
            }
            if (isLogin && ( $(".d_vip_open").html().indexOf("开通") > -1 ) && ( $(".d_vip_open").css("display")!= "none" ) && (( $(".d_vip_open").attr("disabled") == "undefined" ) || ($(".d_vip_open").attr("disabled") == undefined)) && ( $(".d_vip_open").attr("data-type") == "0" ) ) {
                isVipOpen = true;
            }
            if (isLogin &&  ( $(".d_vip_open").html().indexOf("升级") > -1 ) && ( $(".d_vip_open").css("display")!= "none" ) && (( $(".d_vip_open").attr("disabled") == "undefined" ) || $(".d_vip_open").attr("disabled") == undefined) && ( $(".d_vip_open").attr("data-type") == "1" ) ) {
                isUpgrade = true;
            }

            if (isAlbumPay) {
                realTimeLog("MUSIC_FEE","FEE_TYPE:ALBUM_BTN_SHOW|VIEW_TYPE:BATCH_DOWNLOAD|"+psrcPath);
            }
            if (isSinglePay) {
                realTimeLog("MUSIC_FEE","FEE_TYPE:SINGLE_BTN_SHOW|VIEW_TYPE:BATCH_DOWNLOAD|"+psrcPath);
            }
            if (isVipOpen) {
                var LowPriceLog = '';
                var listenInterBoxPrice = downInfo.listenInterBoxPrice;
                if (isLowPrice && listenInterBoxPrice) {
                    LowPriceLog += `|BOXTYPE:${listenInterBoxPrice.boxType}|PRICE:${listenInterBoxPrice.price}`;
                }
                realTimeLog("MUSIC_FEE","FEE_TYPE:OPEN_BTN_SHOW|VIEW_TYPE:BATCH_DOWNLOAD|"+psrcPath + LowPriceLog);
            }
            if (isUpgrade) {
                realTimeLog("MUSIC_FEE","FEE_TYPE:UPGRADE_BTN_SHOW|VIEW_TYPE:BATCH_DOWNLOAD|"+psrcPath);
            }
            if (isExportPay) {
                realTimeLog("MUSIC_FEE","FEE_TYPE:EXPORT_BTN_SHOW|VIEW_TYPE:BATCH_DOWNLOAD|"+psrcPath);
            }
            isWriteLog += 1;
        }

        var diffAlbumArray = [];
        var diffSongArray = [];

        function callClient(call){
            try{
                return window.external.callkwmusic(call);
            }catch(e){
                return "";
            }
        }

        function callClientNoReturn(call) {
            try {
                return window.external.callkwmusic(call, 0);
            } catch (e) {
                return '';
            }
        }

        function callClientAsyn(call,fn){
            window.external.callkwmusic(call, fn);
        }

        var version = "";
        function getVersion(){
            if(version==""){
                version = callClient("GetVer");
            }
            return version;
        }
        function getUserID(s){
            var clientString = callClient("UserState?src=user");
            var clientid = getValue(clientString,s);
            if(clientid==""){
                clientid = 0;
            }
            return clientid;
        }
        /*
        * 获取虚拟id  用于免登陆付费
        * @author 邢祥超 [20191125]
        * */
        function getVirtualUid(s){
            return getValue(callClient("VirtualUsrState"), s);
        }
        function getValue(url,key){
            url = url.toString();
            if(url.indexOf('#')>=0){
                url = url.substring(0,url.length-1);
            }
            var value='';
            var begin = url.indexOf(key + '=');
            if(begin>=0){
                var tmp = url.substring(begin + key.length + 1);
                var eqIdx = tmp.indexOf('=');
                var end = 0;
                if(eqIdx>=0){
                    tmp = tmp.substring(0,eqIdx);
                    end = tmp.lastIndexOf('&');
                }else{
                    end = tmp.length;
                }
                if(end>=0){
                    try{
                        value = decodeURIComponent(tmp.substring(0,end));
                    }catch(e){
                        value = tmp.substring(0,end);
                    }
                }else{
                    try{
                        value = decodeURIComponent(tmp);
                    }catch(e){
                        value = tmp;
                    }
                }
            }
            return value;

        function addNum (num1, num2) {
            var sq1,sq2,m;
            try {
                sq1 = num1.toString().split(".")[1].length;
            }
            catch (e) {
                sq1 = 0;
            }
            try {
                sq2 = num2.toString().split(".")[1].length;
            }
            catch (e) {
                sq2 = 0;
            }
            m = Math.pow(10,Math.max(sq1, sq2));
            return ((num1 * m + num2 * m) / m).toFixed(2);
        }

                    showPriceinfo(someobj,"","");

                    starray = makeUpStArray(someobj, starray);
                }else if(audioarray.length==1){
                    audioarray_final = audioarray[0];
                }else{
                    audioarray_final = obj.audio[0];
                }
                var st = audioarray_final.st;
                if (st == "undefined") {
                    continue;
                }
                if(starray.length==0){
                    starray[starray.length] = "|"+st+"|";
                }else{
                    if(starray.join("").indexOf("|"+st+"|")<0){
                        starray.push("|"+st+"|");
                    }
                }
            }
            return starray;
        }

        /**
         *加入同一首歌双收费策略时，价格显示
         */
        function makeUpStArray(someobj, starray) {
            var st = someobj.st;
            var _starray = someobj.starray;
            if (_starray && _starray.length == 2) {
//		alert("updateprice-->"+_starray.length+",_starray[0].st="+_starray[0].st+",_starray[1].st="+_starray[1].st)
                var st0 = _starray[0].st;
                var st1 = _starray[1].st;
                if (starray.length==0) {
                    starray[starray.length] = "|"+st0+"|";
                    if (starray.join("").indexOf("|"+st1+"|")<0) {
                        starray.push("|"+st1+"|");
                    }
                } else {
                    if (starray.join("").indexOf("|"+st0+"|")<0) {
                        starray.push("|"+st0+"|");
                    }
                    if (starray.join("").indexOf("|"+st1+"|")<0) {
                        starray.push("|"+st1+"|");
                    }
                }
            } else {
                if (starray.length==0) {
                    starray[starray.length] = "|"+st+"|";
                }else{
                    if (starray.join("").indexOf("|"+st+"|")<0) {
                        starray.push("|"+st+"|");
                    }
                }
            }
            return starray;
        }

        function downloadPureFreeMusics() {
            try{
                var pos = $(".d_pos_center input").val();
                pos = $.trim(pos);
                if(pos==""){
                    return;
                }
                pos = encodeURIComponent(pos);
                var totalFree = 0;

                        var hqsizeTemp = "";

                            hqsizeTemp = freeMusic1.eq(i).find(".free_div_info1 span").html();
                        } else if(musiclistobjTemp.musicformat&&musiclistobjTemp.musicformat.length>0){
                            hqnameTemp = musiclistobjTemp.musicformat[0].name;
                            hqsizeTemp = musiclistobjTemp.musicformat[0].size;
                        }
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.name;
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.artist;
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.album;
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.rid;
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.artistid;
                        musicarrayFree[musicarrayFree.length++] = musiclistobjTemp.albumid;

                        musicarrayFree[musicarrayFree.length++] = hqnameTemp;
                        musicarrayFree[musicarrayFree.length++] = hqsizeTemp;
                        totalFree++;
                        bigarray[bigarray.length] = "&bEncrypt"+(i+1)+"=0&isCharge"+(i+1)+"=0"+"&index"+(i+1)+"="+musiclistobjTemp.index+"&s"+(i+1)+"="+encodeURIComponent(musicarrayFree.join('\t'));
                        if(hqnameTemp=="无损音质"){
                            hasFlac = true;
                        }
                    }
                }
                callClientNoReturn("DDownload?pos="+pos+"&n="+totalFree+bigarray.join(''));
                hqConfigChange();
            }catch(e){messageAlert("downMusic:"+e.message)}
        }
        function isDot(num) {
            var result = (num.toString()).indexOf(".");

        function isVip(url) {
          $.ajax({
            url: url,
            type: 'get',
            success: function(res) {
              var data = JSON.parse(res).data;
              var nowTime = new Date().getTime();
              var vipmExpire = data.vipmExpire; // vipmExpire 表示音乐包的过期时间戳  vipLuxuryExpire 表示豪华vip的过期时间戳
              var vipLuxuryExpire = data.vipLuxuryExpire;
              var ShowAd = vipmExpire > nowTime || vipLuxuryExpire > nowTime;
              if (!ShowAd) {
                showAd()
              }
            }
          })
        }
        function userInfo(){
          var url;
          if (loginUid === '0') {
            if (virtualUid !== '0') {
              url = 'http://vip1.kuwo.cn/vip/v2/user/vip?op=getVipSamInfoForVirtualUser&virtualUserId=' + virtualUid;
              isVip(url);
            } else {
              showAd();
            }
          } else {
            url = 'http://vip1.kuwo.cn/vip/v2/user/vip?op=ui&uid=' + loginUid;
            isVip(url);
          }
        }
        function showAd() {
          $.ajax({
            url: 'http://vip1.kuwo.cn/vip/v2/sysinfo?op=getRePayAndDoPayBoxNew&platform=pc',
            type: 'get',
            success: function(res) {
              var data = JSON.parse(res);
              var pcIsAdShow = data.data.pcIsAdShow;
              if (pcIsAdShow === 1) {
                addAd();
              }
            }
          })
        }
