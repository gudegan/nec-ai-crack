<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Document</title>
	<style type="text/css">
		*{
			margin:0;
			padding:0;
		}
		body{
			background-color: #fafafa;
		}
		/*loading*/
		.loadingPage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
			width: 244px;
			overflow: hidden;
			background-color: #fafafa;
			margin: 0 auto;
			text-align: center;
		}

		.loadingPage img {
			display: inline-block;
		}

		.loadingPage p {
			font-family:"微软雅黑";
			margin-top: 20px;
			font-size: 16px;
			color: #666666;
			-webkit-user-select: none;
		}

	</style>
</head>
<body>
	<!--  loading  -->
	<div class="loadingPage" style="display: block">
	    <img src="img/new-loading.gif">
	    <p>正在为您加载...</p>
  </div>

  </script>
</body>
</html>
